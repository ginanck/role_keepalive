---

- name: Check system
  ansible.builtin.assert:
    that:
      - ansible_system == 'Linux'
      - ansible_architecture in ['x86_64', 'aarch64']
      - ansible_os_family in ['Debian', 'RedHat']
    fail_msg: >-
      role_keepalive supports Linux on x86_64 or aarch64 for the Debian and RedHat
      families; detected {{ ansible_system }}/{{ ansible_architecture }}/{{ ansible_os_family }}
    quiet: true
