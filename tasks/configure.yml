---

- name: install keepalived packages
  ansible.builtin.apt:
    name: "{{ keepalive__required_packages }}"
    state: present

- name: generate {{ keepalive__config_file }}
  template:
    src: keepalived.conf.j2
    dest: "{{ keepalive__config_file }}"
    owner: root
    group: root
    mode: 0644
    lstrip_blocks: yes
  notify:
    - restart keepalived
